name: E4c Two Goals
description: All agents on two_goals grid
grid:
  preset: two_goals
agents:
  - id: q
    algo: q_learning
    alpha: 0.1
    exploration: {type: epsilon, eps: 0.1}
    q_init: 0
    eps_bump_on_change: false
    eps_bump_value: 0.3
  - id: s
    algo: sarsa
    alpha: 0.1
    exploration: {type: epsilon, eps: 0.1}
    q_init: 0
    eps_bump_on_change: false
    eps_bump_value: 0.3
  - id: e
    algo: expected_sarsa
    alpha: 0.1
    exploration: {type: epsilon, eps: 0.1}
    q_init: 0
    eps_bump_on_change: false
    eps_bump_value: 0.3
budget: 2000
eval_every: 10
